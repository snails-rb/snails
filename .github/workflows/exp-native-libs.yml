name: exp-native-libs

# Throwaway experiment (never merged): prove the build engines resolve the
# Homebrew native library paths with no export in the job environment. It
# uses the checkout CLI, so the branch's cli/native-libs.sh is what runs.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macos ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    steps:
      - uses: actions/checkout@v4
      - name: Install the documented packages
        run: |
          xcode-select -p
          brew install openssl jemalloc pkg-config libpq
      - name: Show the paths the helper resolves
        run: |
          source cli/native-libs.sh
          export_native_library_paths
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          echo "LIBRARY_PATH=$LIBRARY_PATH"
      - name: Build a PostgreSQL app with no exports
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/pgapp"
          SNAILS_DIR="$PWD" bin/snails new "$app" --database=postgresql
          SNAILS_DIR="$PWD" "$app/bin/build-binary"
          test -x "$app/build/bin/pgapp"
          echo "pg app linked"
