name: ci

# The pull-request gate: the Linux amd64 suite on sqlite only.
# Everything that needs PostgreSQL, macOS, arm64, or the app image runs in
# platform-ci on the merge commit, so a PR does not pay for a second long
# matrix. The pg cases inside these scripts skip when no server is reachable;
# platform-ci's linux-pg job is where they actually run.
#
# Three jobs by kind, not by speed: contract checks against the repo trees,
# the core harness (compiles the core once and runs its cases), and the
# scaffolder end-to-end path (generates an app, compiles it, boots it, runs its
# harness). The e2e job is the slowest and would otherwise hold the other two
# behind it in a single job.

on:
  pull_request:
    paths-ignore:
      - 'manual/**'
      - '**/*.md'
      - 'LICENSE'
  # A pull_request-only workflow cannot be checked before a PR exists, so a
  # change to this file itself needs a manual run as its own verification.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: linux amd64 (contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout snails
        uses: actions/checkout@v4
      - uses: ./.github/actions/linux-build-deps
      - uses: ./.github/actions/spinel-toolchain
      - name: Pins format gate
        run: bash scripts/test-pins-format.sh
      - name: Sync/scaffold contract regression
        run: bash scripts/test-sync-scaffold.sh
      - name: require-all generator regression
        run: bash scripts/test-gen-require-all.sh
      - name: gen-route-helpers
        run: bash scripts/test-gen-route-helpers.sh
      - name: gen-model-columns (AST model parser)
        run: bash scripts/test-gen-model-columns.sh
      - name: queue generator (generate job_queue)
        run: bash scripts/test-generate-job-queue.sh
      - name: Migration runner regression
        run: bash scripts/test-migrate.sh
      - name: CLI regression
        run: bash scripts/test-cli.sh
      - name: Dist lifecycle regression
        run: bash scripts/test-dist.sh

  runtime:
    name: linux amd64 (core harness)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout snails
        uses: actions/checkout@v4
      - uses: ./.github/actions/linux-build-deps
      - uses: ./.github/actions/spinel-toolchain
      - name: Small harness (core spinel compile + contracts)
        run: bash scripts/test-runtime.sh

  e2e:
    name: linux amd64 (scaffolder e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout snails
        uses: actions/checkout@v4
      - uses: ./.github/actions/linux-build-deps
      - uses: ./.github/actions/spinel-toolchain
      # Generates the --scaffold app, compiles it, boots it, and runs its
      # harness. A different object from the core harness: this one tests the
      # generated app tree, not runtime/.
      - name: Scaffolder end-to-end (demo)
        run: bash scripts/test-new.sh --only=demo
