name: ci

# The pull-request gate: the Linux amd64 suites on sqlite, plus the pg app
# end-to-end canary, which starts its own throwaway PostgreSQL containers.
# Everything else that needs PostgreSQL (the core pg regressions and the pg
# app's bin/test), macOS, arm64, or the app image runs in platform-ci on the
# merge commit, so a PR does not pay for a second long matrix. The pg cases
# inside the sqlite scripts skip when no server is reachable; platform-ci's
# Linux pg jobs are where they actually run.
#
# Four jobs by kind, not by speed: contract checks against the repo trees,
# the core harness (compiles the core once and runs its cases), and the app
# end-to-end canaries (demo and pg). The e2e jobs are the slowest and would
# otherwise hold the other two behind them in a single job.

on:
  pull_request:
    paths-ignore:
      - 'manual/**'
      - '**/*.md'
      - 'LICENSE'
  # A pull_request-only workflow cannot be checked before a PR exists, so a
  # change to this file itself needs a manual run as its own verification.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The scripts expand the short spinel pin through the commits API; without a
  # token the shared runner IP's 60/hour budget answers 403 and the resolver
  # falls back (a PATH install here, a source build elsewhere). A fork's
  # pull request gets a read-only token, which is all this needs.
  SNAILS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  contracts:
    name: linux amd64 (contracts)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout snails
        uses: actions/checkout@v7
      - uses: ./.github/actions/linux-build-deps
      - uses: ./.github/actions/spinel-toolchain
      - name: Pins format gate
        run: bash scripts/test-pins-format.sh
      - name: Sync/scaffold contract regression
        run: bash scripts/test-sync-scaffold.sh
      - name: require-all generator regression
        run: bash scripts/test-gen-require-all.sh
      - name: gen-route-helpers
        run: bash scripts/test-gen-route-helpers.sh
      - name: gen-model-columns (AST model parser)
        run: bash scripts/test-gen-model-columns.sh
      - name: queue generator (generate job_queue)
        run: bash scripts/test-generate-job-queue.sh
      - name: Migration runner regression
        run: bash scripts/test-migrate.sh
      - name: CLI regression
        run: bash scripts/test-cli.sh
      - name: Dist lifecycle regression
        run: bash scripts/test-dist.sh
      - name: Release smoke contract
        run: bash scripts/test-release-smoke.sh

  runtime:
    name: linux amd64 (core harness)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout snails
        uses: actions/checkout@v7
      - uses: ./.github/actions/linux-build-deps
      - uses: ./.github/actions/spinel-toolchain
      - name: Small harness (core spinel compile + contracts)
        run: bash scripts/test-runtime.sh

  e2e-demo:
    name: linux amd64 (app e2e demo)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Checkout snails
        uses: actions/checkout@v7
      - uses: ./.github/actions/linux-build-deps
      - uses: ./.github/actions/spinel-toolchain
      # Generates the --scaffold app, compiles it, boots it, and runs its
      # harness. A different object from the core harness: this one tests the
      # generated app tree, not runtime/.
      - name: App end-to-end (demo)
        run: bash scripts/test-new.sh --only=demo

  e2e-pg:
    name: linux amd64 (app e2e pg)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Checkout snails
        uses: actions/checkout@v7
      - uses: ./.github/actions/linux-build-deps
      # The pg canary renders the schema dump through pg_dump against a
      # postgres:18 container, and pg_dump must be the same major as the server.
      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/spinel-toolchain
      # Generates the pg --scaffold app, compiles and boots it, and runs its
      # harness plus the pg dev server contract. A different object from the
      # demo canary: this one exercises the PostgreSQL adapter and dev boot.
      - name: App end-to-end (pg)
        run: bash scripts/test-new.sh --only=pg
