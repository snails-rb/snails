name: platform-ci

# Platform coverage that the Linux amd64 sqlite gate in ci.yml cannot see:
# Linux arm64, PostgreSQL (the core pg regressions and the scaffold app on
# PG_URL), macOS, and the bookworm app image.
#
# This workflow runs the platform jobs on main pushes and manual runs only:
# the macOS runners are the scarce resource, and a PR does not need a second
# long platform matrix. This is the spinel-style split: one Linux job for a
# PR, the remaining OS/target jobs on the merge commit.
#
# The macOS side is split by suite kind (contracts, core, e2e, pg) for the
# same reason ci.yml splits its Linux jobs: one serial macOS job made the gate
# the sum of every suite, so the full suite alone took 11 minutes. The kinds do
# not share compile state, so the split costs no duplicated work beyond the
# per-job setup.
#
# The app image test is conditional: it needs the pinned spinel image, so a
# push that publishes the image runs the test in spinel-image after publishing,
# and this workflow runs it only when the image is already there (see the
# image-preflight and image jobs).

on:
  push:
    branches: [main]
    paths-ignore:
      - 'manual/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  # The scripts expand the short spinel pin through the commits API; without a
  # token the shared runner IP's 60/hour budget answers 403 and the resolver
  # falls back (a PATH install here, a source build elsewhere).
  SNAILS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  linux-arm64:
    name: linux arm64 (sqlite)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout snails
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Load tool pin
        run: |
          REV=$(python3 -c 'import tomllib; print(tomllib.load(open("pins.toml", "rb"))["SPINEL_REV"])')
          echo "SPINEL_REV=$REV" >> "$GITHUB_ENV"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libssl-dev libffi-dev sqlite3 libsqlite3-dev libpq-dev libjemalloc-dev
      - name: Cache the pinned spinel install
        uses: actions/cache@v6
        with:
          path: ~/.local
          key: spinel-install-${{ runner.os }}-${{ runner.arch }}-${{ env.SPINEL_REV }}
      - name: Cache spinel native package objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/spin
          key: spin-native-${{ runner.os }}-${{ runner.arch }}-${{ env.SPINEL_REV }}
          restore-keys: |
            spin-native-${{ runner.os }}-${{ runner.arch }}-
      - name: Build spinel when the cache misses
        run: |
          if "$HOME/.local/bin/spin" --version 2>/dev/null | grep -q "${SPINEL_REV:0:8}"; then
            echo "cached spinel matches $SPINEL_REV"
            exit 0
          fi
          rm -rf "$RUNNER_TEMP/spinel-src"
          git clone https://github.com/matz/spinel "$RUNNER_TEMP/spinel-src"
          cd "$RUNNER_TEMP/spinel-src"
          git checkout "$SPINEL_REV"
          make deps
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make install PREFIX="$HOME/.local"
      - name: Expose the pinned toolchain
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/spin" --version
      - name: Small harness (sqlite)
        run: /bin/bash scripts/test-runtime.sh

  # The pg gate is two jobs per platform: the core regressions and the
  # app e2e each compile from scratch, and one job paid their sum
  # (8m26s on Linux, 8m08s on macOS). They share no compile state, so the
  # split costs only the per-job setup.
  linux-pg-core:
    name: linux pg core (PG_URL)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout snails
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Load tool pin
        run: |
          REV=$(python3 -c 'import tomllib; print(tomllib.load(open("pins.toml", "rb"))["SPINEL_REV"])')
          echo "SPINEL_REV=$REV" >> "$GITHUB_ENV"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libssl-dev libffi-dev sqlite3 libsqlite3-dev libpq-dev libjemalloc-dev \
            postgresql-client
      # The postgres service runs 18, but Ubuntu's postgresql-client is 16 and
      # pg_dump refuses a newer server. Install the 18 client and put its bin
      # ahead of Ubuntu's version wrapper on PATH.
      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Cache the pinned spinel install
        uses: actions/cache@v6
        with:
          path: ~/.local
          key: spinel-install-${{ runner.os }}-${{ runner.arch }}-${{ env.SPINEL_REV }}
      - name: Cache spinel native package objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/spin
          key: spin-native-${{ runner.os }}-${{ runner.arch }}-${{ env.SPINEL_REV }}
          restore-keys: |
            spin-native-${{ runner.os }}-${{ runner.arch }}-
      - name: Build spinel when the cache misses
        run: |
          if "$HOME/.local/bin/spin" --version 2>/dev/null | grep -q "${SPINEL_REV:0:8}"; then
            echo "cached spinel matches $SPINEL_REV"
            exit 0
          fi
          rm -rf "$RUNNER_TEMP/spinel-src"
          git clone https://github.com/matz/spinel "$RUNNER_TEMP/spinel-src"
          cd "$RUNNER_TEMP/spinel-src"
          git checkout "$SPINEL_REV"
          make deps
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make install PREFIX="$HOME/.local"
      - name: Expose the pinned toolchain
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/spin" --version
      - name: Core pg regressions
        env:
          SNAILS_DIR: ${{ github.workspace }}
          PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          /bin/bash scripts/test-generate-job-queue.sh
          /bin/bash scripts/test-migrate.sh
          /bin/bash scripts/test-runtime.sh --pg

  linux-pg-app:
    name: linux pg app (PG_URL)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout snails
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Load tool pin
        run: |
          REV=$(python3 -c 'import tomllib; print(tomllib.load(open("pins.toml", "rb"))["SPINEL_REV"])')
          echo "SPINEL_REV=$REV" >> "$GITHUB_ENV"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libssl-dev libffi-dev sqlite3 libsqlite3-dev libpq-dev libjemalloc-dev \
            postgresql-client
      # The postgres service runs 18, but Ubuntu's postgresql-client is 16 and
      # pg_dump refuses a newer server. Install the 18 client and put its bin
      # ahead of Ubuntu's version wrapper on PATH.
      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Cache the pinned spinel install
        uses: actions/cache@v6
        with:
          path: ~/.local
          key: spinel-install-${{ runner.os }}-${{ runner.arch }}-${{ env.SPINEL_REV }}
      - name: Cache spinel native package objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/spin
          key: spin-native-${{ runner.os }}-${{ runner.arch }}-${{ env.SPINEL_REV }}
          restore-keys: |
            spin-native-${{ runner.os }}-${{ runner.arch }}-
      - name: Build spinel when the cache misses
        run: |
          if "$HOME/.local/bin/spin" --version 2>/dev/null | grep -q "${SPINEL_REV:0:8}"; then
            echo "cached spinel matches $SPINEL_REV"
            exit 0
          fi
          rm -rf "$RUNNER_TEMP/spinel-src"
          git clone https://github.com/matz/spinel "$RUNNER_TEMP/spinel-src"
          cd "$RUNNER_TEMP/spinel-src"
          git checkout "$SPINEL_REV"
          make deps
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make install PREFIX="$HOME/.local"
      - name: Expose the pinned toolchain
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/spin" --version
      - name: Harness test against PG_URL
        env:
          SNAILS_DIR: ${{ github.workspace }}
          PG_URL: postgres://postgres:postgres@127.0.0.1:5432/snails_test
        run: |
          psql "postgres://postgres:postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE snails_test"
          APP="$RUNNER_TEMP/pgapp"
          rm -rf "$APP"
          "$SNAILS_DIR/bin/snails" new "$APP" --scaffold --database=postgresql
          "$SNAILS_DIR/bin/snails" migrate dump --app "$APP"
          "$APP/bin/test"

  # The macOS gate is split by suite kind, because a single serial job paid
  # for every suite in one wall-clock run. Each job still exercises the same
  # cases: the contract job runs the sqlite surface (the pg cases skip without
  # a reachable server) and the pg jobs run those same cases with PG_URL set,
  # exactly as ci.yml's Linux contracts and platform-ci's Linux pg jobs do.
  # The pg pair is split for the same reason as the Linux pg pair above.
  macos-contracts:
    name: macos (contracts)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout snails
        uses: actions/checkout@v7
      - uses: ./.github/actions/macos-build-deps
      - uses: ./.github/actions/spinel-toolchain
      - name: Contract checks
        run: |
          /bin/bash scripts/test-pins-format.sh
          /bin/bash scripts/test-sync-scaffold.sh
          /bin/bash scripts/test-gen-require-all.sh
          /bin/bash scripts/test-gen-route-helpers.sh
          /bin/bash scripts/test-gen-model-columns.sh
          /bin/bash scripts/test-generate-job-queue.sh
          /bin/bash scripts/test-migrate.sh
          /bin/bash scripts/test-cli.sh
          /bin/bash scripts/test-dist.sh

  macos-core:
    name: macos (core harness)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout snails
        uses: actions/checkout@v7
      - uses: ./.github/actions/macos-build-deps
      - uses: ./.github/actions/spinel-toolchain
      - name: Small harness (core)
        run: /bin/bash scripts/test-runtime.sh

  macos-e2e:
    name: macos (app e2e)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout snails
        uses: actions/checkout@v7
      - uses: ./.github/actions/macos-build-deps
      - uses: ./.github/actions/spinel-toolchain
      - name: App end-to-end (demo)
        run: /bin/bash scripts/test-new.sh --only=demo

  macos-pg-core:
    name: macos (pg core)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout snails
        uses: actions/checkout@v7
      - uses: ./.github/actions/macos-build-deps
      - uses: ./.github/actions/spinel-toolchain
      - name: Start PostgreSQL
        run: |
          pgbin="$(brew --prefix postgresql@18)/bin"
          echo "$pgbin" >> "$GITHUB_PATH"
          "$pgbin/initdb" -D "$RUNNER_TEMP/pgdata" -U postgres --no-locale >/dev/null
          "$pgbin/pg_ctl" -D "$RUNNER_TEMP/pgdata" -l "$RUNNER_TEMP/pg.log" -o "-p 5432 -k $RUNNER_TEMP" start
          "$pgbin/createdb" -h 127.0.0.1 -p 5432 -U postgres snails_test
      - name: Core pg regressions
        env:
          SNAILS_DIR: ${{ github.workspace }}
          PG_URL: postgres://postgres@127.0.0.1:5432/snails_test
        run: |
          /bin/bash scripts/test-generate-job-queue.sh
          /bin/bash scripts/test-migrate.sh
          /bin/bash scripts/test-runtime.sh --pg

  macos-pg-app:
    name: macos (pg app)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout snails
        uses: actions/checkout@v7
      - uses: ./.github/actions/macos-build-deps
      - uses: ./.github/actions/spinel-toolchain
      - name: Start PostgreSQL
        run: |
          pgbin="$(brew --prefix postgresql@18)/bin"
          echo "$pgbin" >> "$GITHUB_PATH"
          "$pgbin/initdb" -D "$RUNNER_TEMP/pgdata" -U postgres --no-locale >/dev/null
          "$pgbin/pg_ctl" -D "$RUNNER_TEMP/pgdata" -l "$RUNNER_TEMP/pg.log" -o "-p 5432 -k $RUNNER_TEMP" start
          "$pgbin/createdb" -h 127.0.0.1 -p 5432 -U postgres snails_test
      - name: Harness test against PG_URL
        env:
          SNAILS_DIR: ${{ github.workspace }}
          PG_URL: postgres://postgres@127.0.0.1:5432/snails_test
        run: |
          APP="$RUNNER_TEMP/pgapp"
          rm -rf "$APP"
          "$SNAILS_DIR/bin/snails" new "$APP" --scaffold --database=postgresql
          "$SNAILS_DIR/bin/snails" migrate dump --app "$APP"
          "$APP/bin/test"

  # The app image test builds an app from the pinned spinel image, so it can
  # only run when that image exists. A push that bumps the pin publishes it
  # from the same commit in spinel-image, which runs the test there after
  # publishing; this copy covers pushes that do not publish.
  image-preflight:
    name: pin image published
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      published: ${{ steps.probe.outputs.published }}
    steps:
      - name: Checkout snails
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Load tool pin
        run: |
          REV=$(python3 -c 'import tomllib; print(tomllib.load(open("pins.toml", "rb"))["SPINEL_REV"])')
          echo "SPINEL_REV=$REV" >> "$GITHUB_ENV"
      - name: Check whether the pin image is published
        id: probe
        run: |
          image="ghcr.io/snails-rb/spinel:$SPINEL_REV"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "spinel image for $SPINEL_REV is published — running the app image test"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "spinel image for $SPINEL_REV is not published — skipping the app image test"
            echo "spinel-image runs the test after publishing the image; if no publish run exists for this commit, publish it first: gh workflow run spinel-image.yml"
          fi

  image:
    # Same test as spinel-image's app-image job; this copy is conditional for
    # the reason the preflight explains.
    needs: image-preflight
    if: needs.image-preflight.outputs.published == 'true'
    uses: ./.github/workflows/app-image-test.yml
