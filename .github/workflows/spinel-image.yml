name: spinel-image

# Publishes ghcr.io/snails-rb/spinel — the pinned spinel toolchain plus build
# dependencies — as one multi-arch image per pins.toml SPINEL_REV. Consumers
# (app Dockerfiles) FROM that tag, so this workflow is the only publish path.
#
# After publishing, the run tests an app build from the new image (the
# app-image job): that consumer path is what the image exists for, and running
# it here, after the publish, keeps it from racing a pin bump.
#
# Triggers: pin (or Dockerfile/workflow) changes reaching main, or a manual
# run. There is deliberately no skip-if-exists guard — re-running re-publishes
# the same pin tag, and image tags are mutable pointers for a pin (callers
# that need immutability pin the manifest digest).
on:
  push:
    branches: [main]
    paths:
      - pins.toml
      - Dockerfile.spinel
      - .github/workflows/spinel-image.yml
  workflow_dispatch:

concurrency:
  group: spinel-image-${{ github.ref }}
  # A publish is a release action: queue a second run instead of cancelling
  # one between the per-arch pushes and the tag merge (a cancelled merge can
  # leave the pin tag missing or partial).
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/snails-rb/spinel

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rev: ${{ steps.pin.outputs.rev }}
      full: ${{ steps.pin.outputs.full }}
    steps:
      - name: Checkout snails
        uses: actions/checkout@v7
      # tomllib parses the pins file against its format contract instead of
      # grepping KEY=VALUE lines (same reader as ci.yml).
      - name: Read the spinel pin
        id: pin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REV=$(python3 -c 'import tomllib; print(tomllib.load(open("pins.toml", "rb"))["SPINEL_REV"])')
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          FULL=$(curl -fsSL --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/matz/spinel/commits/$REV" |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["sha"])')
          [[ $FULL =~ ^[0-9a-f]{40}$ ]] || {
            echo "the commit API did not return a full revision for $REV: $FULL" >&2
            exit 1
          }
          [[ $FULL == "$REV"* ]] || {
            echo "the resolved commit $FULL does not start with the pin $REV" >&2
            exit 1
          }
          echo "full=$FULL" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.arch }}
    needs: pin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native on each arch — cross-emulating the other one is the
          # 15-19 minute cost this workflow exists to avoid.
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
    steps:
      - name: Checkout snails
        uses: actions/checkout@v7

      # The snails-rb org owns the package; a PAT with write:packages publishes
      # it (secrets must exist before the first run — see cli-publish skill).
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.SNAILS_RB_REGISTRY_USER }}
          password: ${{ secrets.SNAILS_RB_REGISTRY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (one arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.spinel
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ needs.pin.outputs.rev }}-${{ matrix.arch }}
          build-args: |
            SPINEL_REV=${{ needs.pin.outputs.rev }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max

  publish:
    name: publish pin tag
    needs: [pin, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.SNAILS_RB_REGISTRY_USER }}
          password: ${{ secrets.SNAILS_RB_REGISTRY_TOKEN }}

      - name: Merge both arches under the pin tag
        env:
          REV: ${{ needs.pin.outputs.rev }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$REV" \
            "$IMAGE:$REV-arm64" \
            "$IMAGE:$REV-amd64"
          docker buildx imagetools inspect "$IMAGE:$REV"

      # The image is already pushed: this guard fails the run (and alerts)
      # when the compressed image grows past the docs target; it cannot
      # unpublish. A pre-push check would need a separate build-without-push.
      - name: Check compressed size
        env:
          REV: ${{ needs.pin.outputs.rev }}
        run: |
          for arch in amd64 arm64; do
            bytes=$(docker buildx imagetools inspect --raw "$IMAGE:$REV-$arch" | python3 -c 'import json, sys; print(sum(layer["size"] for layer in json.load(sys.stdin)["layers"]))')
            mb=$((bytes / 1000000))
            echo "image size: $arch ${mb} MB compressed"
            if (( bytes > 200000000 )); then
              echo "image size guard: $arch compressed ${mb} MB exceeds 200 MB — review the package set in Dockerfile.spinel" >&2
              exit 1
            fi
          done

  # The toolchain tarballs are the non-Docker installation path. Linux
  # assets come from the just-built bookworm image (the same ABI contract);
  # macOS assets must be built natively because no image exists.
  toolchain-linux:
    name: toolchain asset linux ${{ matrix.arch }}
    needs: [pin, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout snails
        uses: actions/checkout@v7
      - name: Extract the toolchain from the published image
        env:
          REV: ${{ needs.pin.outputs.rev }}
          FULL: ${{ needs.pin.outputs.full }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cid="$(docker create "$IMAGE:$REV-$ARCH")"
          unit="$RUNNER_TEMP/toolchain"
          mkdir -p "$unit"
          docker cp "$cid:/opt/spinel/lib/spinel/." "$unit/"
          docker cp "$cid:/opt/spinel/LICENSE" "$unit/LICENSE"
          docker cp "$cid:/opt/spinel/licenses" "$unit/licenses"
          docker rm "$cid" >/dev/null
          asset="$(bash -c 'source cli/toolchain.sh; spinel_toolchain_asset_name "$1" linux "$2"' _ "$FULL" "$ARCH")"
          mkdir -p dist
          tar -czf "dist/$asset" -C "$unit" .
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$asset" > "$asset.sha256")
          else
            (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
          fi
          listing="$RUNNER_TEMP/toolchain-list.txt"
          tar -tzf "dist/$asset" > "$listing"
          grep -qx './spin' "$listing"
          grep -qx './spinel' "$listing"
          grep -qx './builtins/' "$listing"
          grep -qx './lib/' "$listing"
          grep -qx './packages/' "$listing"
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-linux-${{ matrix.arch }}
          path: dist/
          retention-days: 7

  toolchain-macos:
    name: toolchain asset macos ${{ matrix.arch }}
    needs: pin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - name: Checkout snails
        uses: actions/checkout@v7
      - name: Install Homebrew dependencies
        run: |
          brew install openssl jemalloc pkg-config libpq libffi ruby
          echo "$(brew --prefix ruby)/bin" >> "$GITHUB_PATH"
          {
            echo "PKG_CONFIG_PATH=$(brew --prefix openssl)/lib/pkgconfig:$(brew --prefix jemalloc)/lib/pkgconfig:$(brew --prefix libpq)/lib/pkgconfig:$(brew --prefix libffi)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "CPATH=$(brew --prefix openssl)/include:$(brew --prefix jemalloc)/include:$(brew --prefix libpq)/include:$(brew --prefix libffi)/include:${CPATH:-}"
            echo "LIBRARY_PATH=$(brew --prefix openssl)/lib:$(brew --prefix jemalloc)/lib:$(brew --prefix libpq)/lib:$(brew --prefix libffi)/lib:${LIBRARY_PATH:-}"
            echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix openssl)/lib:$(brew --prefix jemalloc)/lib:$(brew --prefix libpq)/lib:$(brew --prefix libffi)/lib:${DYLD_FALLBACK_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"
      - name: Build and smoke the toolchain asset
        env:
          REV: ${{ needs.pin.outputs.rev }}
          FULL: ${{ needs.pin.outputs.full }}
          ARCH: ${{ matrix.arch }}
        run: |
          bash scripts/build-toolchain-asset.sh \
            --rev "$REV" --full "$FULL" --os darwin --arch "$ARCH" \
            --out "$GITHUB_WORKSPACE/dist"
      - name: Build a project with the packaged asset
        env:
          SNAILS_DIR: ${{ github.workspace }}
          FULL: ${{ needs.pin.outputs.full }}
          # The CLI expands the short pin through the commit API. Without a
          # token that call shares the runner IP's 60/hour budget, and a
          # failure sends `snails new` down the source-build fallback.
          SNAILS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release"
          rm -rf "$release"
          mkdir -p "$release/spinel-rev-$FULL"
          cp "$GITHUB_WORKSPACE"/dist/* "$release/spinel-rev-$FULL/"
          app="$RUNNER_TEMP/asset-app"
          rm -rf "$app"
          log="$RUNNER_TEMP/asset-new.log"
          SNAILS_SPINEL_BASE_URL="file://$release" \
            "$SNAILS_DIR/bin/snails" new "$app" 2>&1 | tee "$log"
          grep -q 'ready (download)' "$log" || {
            echo "snails new did not use the packaged asset — see the output above" >&2
            exit 1
          }
          "$app/bin/test"
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-macos-${{ matrix.arch }}
          path: dist/
          retention-days: 7

  publish-toolchain:
    name: publish toolchain assets
    needs: [pin, toolchain-linux, toolchain-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the toolchain assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'toolchain-*'
          merge-multiple: true
      - name: Publish the toolchain release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FULL: ${{ needs.pin.outputs.full }}
        run: |
          set -euo pipefail
          tag="spinel-rev-$FULL"
          cat > release-notes.md <<NOTES
          spinel toolchain ${FULL}

          Source: https://github.com/matz/spinel/commit/${FULL}

          Assets: linux-amd64, linux-arm64, darwin-arm64, darwin-amd64.

          - Linux assets are built from the bookworm image; they run on glibc 2.36 or newer.
          - macOS assets target macOS 13 or newer and link the Homebrew openssl they were built with (brew install openssl; 4.x on Apple Silicon, currently 3.x on Intel).
          - The smoke built openssl, ffi, json, sqlite3, pq, and a jemalloc spin app.

          The snails CLI downloads this release for the pinned SPINEL_REV; a
          missing or unavailable asset falls back to the source build.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --notes-file release-notes.md --prerelease
          else
            gh release create "$tag" dist/* \
              --title "spinel toolchain $FULL" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false
          fi

  # An app build from the just-published image. Code pushes that do not publish
  # run the same test in platform-ci, where the image already exists.
  app-image:
    name: app image test
    needs: [pin, publish]
    uses: ./.github/workflows/app-image-test.yml
