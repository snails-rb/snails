name: linux build deps
description: >
  The system packages every Linux job needs before the spinel toolchain
  installs: clang and libclang for the compile, sqlite3 for the adapter and the
  migration runner, and the -dev headers the fixtures link (sqlite3, pq,
  jemalloc). Call it before .github/actions/spinel-toolchain.

runs:
  using: composite
  steps:
    - name: Install system deps
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang libclang-dev \
          sqlite3 libsqlite3-dev \
          libpq-dev libjemalloc-dev
